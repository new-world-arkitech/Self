<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELF. // Task & Mission Control</title>
    <style>
        :root {
            --bg-base: #050508;
            --bg-card: rgba(15, 18, 28, 0.85);
            --bg-input: #0a0d14;
            --accent-cyan: #00f0ff;
            --accent-gold: #eab308;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-subtle: rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 16px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-cyan);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .add-task-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        input, select {
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 14px;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        button.btn-add {
            background: var(--accent-cyan);
            color: #050508;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.btn-add:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-1px);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-chip.active, .filter-chip:hover {
            color: #fff;
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: border-color 0.2s;
        }

        .task-card:hover {
            border-color: rgba(0, 240, 255, 0.3);
        }

        .task-card.completed {
            border-left: 4px solid var(--accent-green);
            opacity: 0.65;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-card.abandoned {
            border-left: 4px solid var(--accent-red);
            opacity: 0.5;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .btn-check {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--accent-cyan);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            transition: all 0.2s;
        }

        .task-card.completed .btn-check {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #050508;
            font-weight: bold;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
        }

        .task-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-domain {
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-xp {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .badge-priority {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .priority-HIGH, .priority-CRITICAL { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .priority-MEDIUM { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .priority-LOW { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

        .btn-abandon {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-abandon:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <div class="logo">SELF. // MISSIONS & TASKS</div>
            <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
                Direct Active Tasks bound to 3D Avatar Evolution
            </div>
        </div>
        <div id="avatarBadge" style="text-align: right;">
            <div style="font-size: 11px; color: var(--text-muted);">AVATAR COMPOSITE</div>
            <div id="avatarLevel" style="font-size: 16px; font-weight: bold; color: var(--accent-cyan);">LEVEL 1 (110 XP)</div>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Missions</div>
            <div class="stat-val" id="statTotal">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Conquered</div>
            <div class="stat-val" id="statCompleted" style="color: var(--accent-green);">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">In-Flight / Pending</div>
            <div class="stat-val" id="statPending" style="color: var(--accent-cyan);">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Grit Completion</div>
            <div class="stat-val" id="statRate" style="color: var(--accent-gold);">-</div>
        </div>
    </div>

    <!-- Add Task Panel -->
    <div class="add-task-panel">
        <div class="panel-title">
            <span>+</span> Deploy New Mission / Task
        </div>
        <div class="form-row">
            <input type="text" id="taskInput" placeholder="What task or habit must be executed?" autofocus>
            <select id="domainSelect">
                <option value="Self.knowledge">Self.knowledge (Neural HUD)</option>
                <option value="Self.temple">Self.temple (Vitality & Body)</option>
                <option value="Self.credit">Self.credit (Radiance & Aura)</option>
                <option value="Self.career">Self.career (Exoskeleton Armor)</option>
                <option value="Self.legal">Self.legal (Structural Seal)</option>
            </select>
            <select id="prioritySelect">
                <option value="MEDIUM">Medium Priority</option>
                <option value="HIGH">High Priority</option>
                <option value="CRITICAL">Critical</option>
                <option value="LOW">Low</option>
            </select>
            <input type="number" id="xpInput" placeholder="XP (Auto)" min="10" max="500" style="width: 100px;">
            <button class="btn-add" onclick="submitTask()">ADD MISSION</button>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-chip active" onclick="setFilter('ALL', this)">ALL</div>
        <div class="filter-chip" onclick="setFilter('PENDING', this)">PENDING</div>
        <div class="filter-chip" onclick="setFilter('COMPLETED', this)">CONQUERED</div>
        <div class="filter-chip" onclick="setFilter('ABANDONED', this)">ABANDONED</div>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskListContainer">
        <!-- Rendered dynamically -->
    </div>
</div>

<script>
    let currentFilter = 'ALL';
    let tasksData = [];

    async function loadData() {
        try {
            const res = await fetch('/api/tasks');
            const data = await res.json();
            tasksData = data.tasks || [];
            updateStats(data.stats);

            // Fetch avatar state
            const stateRes = await fetch('/api/state');
            const state = await stateRes.json();
            if (state.avatar_composite) {
                document.getElementById('avatarLevel').textContent = 
                    `LEVEL ${state.avatar_composite.overall_level} (${state.avatar_composite.total_xp} XP)`;
            }

            renderTasks();
        } catch (err) {
            console.error("Error loading task data:", err);
        }
    }

    function updateStats(stats) {
        if (!stats) return;
        document.getElementById('statTotal').textContent = stats.total_tasks;
        document.getElementById('statCompleted').textContent = stats.completed;
        document.getElementById('statPending').textContent = stats.pending;
        document.getElementById('statRate').textContent = `${stats.completion_rate}%`;
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        renderTasks();
    }

    function renderTasks() {
        const container = document.getElementById('taskListContainer');
        container.innerHTML = '';

        let filtered = tasksData;
        if (currentFilter === 'PENDING') {
            filtered = tasksData.filter(t => t.status === 'PENDING' || t.status === 'IN_PROGRESS');
        } else if (currentFilter === 'COMPLETED') {
            filtered = tasksData.filter(t => t.status === 'COMPLETED');
        } else if (currentFilter === 'ABANDONED') {
            filtered = tasksData.filter(t => t.status === 'ABANDONED');
        }

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No missions found in this category.</div>`;
            return;
        }

        filtered.forEach(task => {
            const card = document.createElement('div');
            card.className = `task-card ${task.status.toLowerCase()}`;

            const isDone = task.status === 'COMPLETED';
            const isAbandoned = task.status === 'ABANDONED';

            card.innerHTML = `
                <div class="task-left">
                    <button class="btn-check" onclick="toggleComplete('${task.id}')" ${isDone || isAbandoned ? 'disabled' : ''}>
                        ${isDone ? '✓' : ''}
                    </button>
                    <div class="task-info">
                        <div class="task-title">${task.title}</div>
                        <div class="task-meta">
                            <span class="badge-domain">${task.domain}</span>
                            <span class="badge-priority priority-${task.priority}">${task.priority}</span>
                            <span class="badge-xp">+${task.xp_value} XP</span>
                            ${task.abandon_reason ? `<span style="color:#ef4444;">Reason: ${task.abandon_reason}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div>
                    ${!isDone && !isAbandoned ? `
                        <button class="btn-abandon" onclick="promptAbandon('${task.id}')">ABANDON</button>
                    ` : ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function submitTask() {
        const titleInput = document.getElementById('taskInput');
        const domainSelect = document.getElementById('domainSelect');
        const prioritySelect = document.getElementById('prioritySelect');
        const xpInput = document.getElementById('xpInput');

        const title = titleInput.value.trim();
        if (!title) return;

        const payload = {
            title: title,
            domain: domainSelect.value,
            priority: prioritySelect.value,
            xp_value: xpInput.value ? parseInt(xpInput.value) : null
        };

        const res = await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            titleInput.value = '';
            xpInput.value = '';
            await loadData();
        }
    }

    async function toggleComplete(taskId) {
        const res = await fetch(`/api/tasks/${taskId}/complete`, { method: 'POST' });
        if (res.ok) {
            await loadData();
        }
    }

    async function promptAbandon(taskId) {
        const reason = prompt("Enter reason for abandoning this mission (feeds into your Grit diagnostic ledger):");
        if (reason === null) return; // User cancelled prompt

        const res = await fetch(`/api/tasks/${taskId}/abandon`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason || "Deprioritized" })
        });

        if (res.ok) {
            await loadData();
        }
    }

    // Enter key submit listener
    document.getElementById('taskInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitTask();
    });

    // Auto-refresh every 10 seconds or on initial load
    loadData();
</script>

</body>
</html>
